name: Keep API warm (backup)

on:
  schedule:
    # Hourly backup only — an external free pinger (UptimeRobot / cron-job.org)
    # does the real 5-minute keeping-warm. Hourly keeps this inside the free
    # GitHub Actions minute budget for a private repo (~720 min/mo < 2,000).
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake + keep warm
        run: |
          URL="https://dev-hostel-api.onrender.com/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is warm."
              exit 0
            fi
            sleep 20
          done
          echo "API did not respond 200 after 6 gentle attempts"
          exit 1
