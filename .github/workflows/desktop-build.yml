name: Build Desktop Apps

on:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dev-hostel-windows
            paths: |
              mobile/src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            artifact: dev-hostel-macos
            paths: |
              mobile/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build desktop app
        working-directory: mobile
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}