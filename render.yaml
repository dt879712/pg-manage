# Render Blueprint — deploy the API as a Docker web service with HTTPS.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dev-hostel-api
    runtime: docker
    # "free" spins down after 15 min idle (slow first request). Upgrade to "starter" for always-on.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: RESET_URL_BASE
        value: https://dev-hostel-web.onrender.com
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Static site: hosts the app's web build so password-reset links are real https URLs.
  - type: web
    name: dev-hostel-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://dev-hostel-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
